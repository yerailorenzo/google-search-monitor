name: Monitor rápido (Status Dashboard, blog, novedades)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # cada 10 min, fuera de los minutos en punto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-state       # compartido con el rastreo de docs: nunca escriben a la vez
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar fuentes y avisar
        run: python monitor.py fast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Cambios detectados (rápido) $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
